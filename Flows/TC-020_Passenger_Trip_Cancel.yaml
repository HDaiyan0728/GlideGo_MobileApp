appId: com.sci.glidego_rider

name: TC-020 Passenger Trip Cancel
description: |
  Cancel a pending trip request in GlideGo Rider App

properties:
  testCaseId: TC_020
  priority: Medium
  suite: Trip Request
  type: E2E
  flow: Trip Cancel
  tags: "smoke"
  owner: Hasin Daiyan
  dataSource: http://localhost:8080/WithinCity

---
# =========================================================
# Step 1: Reset app & login
# =========================================================
- launchApp:
    clearState: true

- runFlow: Login.yaml

- extendedWaitUntil:
    visible: "My Trips.*"
    timeout: 15000

# =========================================================
# Step 2: Load row data from Excel (auto-generated script)
# =========================================================
- runScript: "../Scripts/TripCancel/TripCancel.js"

# =========================================================
# Step 3: Go to My Trips → Pending tab
# =========================================================
- extendedWaitUntil:
    visible: "My Trips.*"
    timeout: 10000
- tapOn: "My Trips"

- extendedWaitUntil:
    visible: "Pending\nTab 2 of 5"
    timeout: 10000
- tapOn: "Pending\nTab 2 of 5"

# =========================================================
# Step 4: Search for the trip
# =========================================================
- extendedWaitUntil:
    visible: "Search trip number, title"
    timeout: 10000
- tapOn: "Search trip number, title"
- eraseText
- inputText: ${output.searchText}
- tapOn: "Done"

# =========================================================
# Step 5: Open the matching trip
# =========================================================
- extendedWaitUntil:
    visible: ".*#${output.tripId}.*"
    timeout: 10000
- tapOn:
    text: ".*#${output.tripId}.*"

- extendedWaitUntil:
    visible: "Trip ID #${output.tripId}"
    timeout: 10000
- assertVisible: "Trip ID #${output.tripId}"

- assertVisible: "Pending Budget Holder Approval"



# =========================================================
# Step 6: Scroll to Cancel Request
# =========================================================
- scrollUntilVisible:
    element:
      text: "Cancel Request"
    direction: DOWN
    timeout: 15000

- extendedWaitUntil:
    visible: "Cancel Request"
    timeout: 5000
- tapOn: "Cancel Request"

# =========================================================
# Step 7: Provide cancellation reason
# =========================================================
- extendedWaitUntil:
    visible: "Briefly explain why this request is being canceled"
    timeout: 10000
- tapOn: "Briefly explain why this request is being canceled"
- inputText: "test"
- hideKeyboard

- extendedWaitUntil:
    visible: "Confirm Cancellation"
    timeout: 5000
- tapOn: "Confirm Cancellation"

# =========================================================
# Step 8: Wait for UI to settle after cancellation
# =========================================================
- waitForAnimationToEnd:
    timeout: 3000

- tapOn:
    text: "Home"
    index: 0

- tapOn: "My Trips"
- tapOn: "Pending\nTab 2 of 5"



# =========================================================
# Step 9: Verify trip is removed from Pending list
# =========================================================
- extendedWaitUntil:
    visible: "Search trip number, title"
    timeout: 15000
- tapOn: "Search trip number, title"
- eraseText
- inputText: ${output.searchText}
- tapOn: "Done"

- extendedWaitUntil:
    notVisible: ".*#${output.tripId}.*"
    timeout: 15000
