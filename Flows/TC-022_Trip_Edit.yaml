appId: com.sci.glidego_rider

name: TC-022 Trip Edit
description: |
  Edit an existing pending trip request in GlideGo Rider App

properties:
  testCaseId: TC_022
  priority: Medium
  suite: Trip Request
  type: E2E
  flow: Trip Edit
  tags: "smoke"
  owner: Hasin Daiyan
  dataSource: http://localhost:8080/WithinCity

---
# =========================================================
# Step 1: Reset app & login
# =========================================================
- launchApp:
    clearState: true

- runFlow: Login.yaml

- extendedWaitUntil:
    visible: "My Trips.*"
    timeout: 15000

# =========================================================
# Step 2: Load row data from Excel (auto-generated script)
# =========================================================
- runScript: "../Scripts/TripUpdate/TripEdit.js"

# =========================================================
# Step 3: Go to My Trips → Pending tab
# =========================================================
- extendedWaitUntil:
    visible: "My Trips.*"
    timeout: 10000
- tapOn: "My Trips"

- extendedWaitUntil:
    visible: "Pending\nTab 2 of 5"
    timeout: 10000
- tapOn: "Pending\nTab 2 of 5"

# =========================================================
# Step 4: Search for the trip
# =========================================================
- extendedWaitUntil:
    visible: "Search trip number, title"
    timeout: 10000
- tapOn: "Search trip number, title"
- eraseText
- inputText: ${output.searchText}
- tapOn: "Done"

# =========================================================
# Step 5: Open the matching trip
# =========================================================
- extendedWaitUntil:
    visible: ".*#${output.tripId}.*"
    timeout: 10000
- tapOn:
    text: ".*#${output.tripId}.*"

- extendedWaitUntil:
    visible: "Trip ID #${output.tripId}"
    timeout: 10000
- assertVisible: "Trip ID #${output.tripId}"
- assertVisible: "Pending Budget Holder Approval"

# =========================================================
# Step 6: Scroll to Edit Request and open editor
# =========================================================
- scrollUntilVisible:
    element:
      text: "Edit Request"
    direction: DOWN
    timeout: 15000

- extendedWaitUntil:
    visible: "Edit Request"
    timeout: 5000
- tapOn: "Edit Request"

- waitForAnimationToEnd:
    timeout: 3000

- extendedWaitUntil:
    visible: "Confirm Route"
    timeout: 10000
- tapOn: "Confirm Route"

# =========================================================
# Step 7: Edit the Purpose of Trip field
# =========================================================
- extendedWaitUntil:
    visible: "Purpose of Trip"
    timeout: 10000
- assertVisible: "Purpose of Trip"

- assertVisible: "Purpose of Trip"
- doubleTapOn: "${output.searchText}"
- eraseText
- inputText: "${output.searchText} Edited"
- hideKeyboard

# =========================================================
# Step 8: Review changes
# =========================================================
- scrollUntilVisible:
    element:
      text: "Review"
    direction: DOWN
    timeout: 15000

- extendedWaitUntil:
    visible: "Review"
    timeout: 5000
- tapOn: "Review"

- extendedWaitUntil:
    visible: "Purpose of Travel:"
    timeout: 10000
- assertVisible: "Purpose of Travel:"
- assertVisible: ".*${output.searchText} Edited.*"

# =========================================================
# Step 9: Update request and return home
# =========================================================
- scrollUntilVisible:
    element:
      text: "Update Request"
    direction: DOWN
    timeout: 15000

- extendedWaitUntil:
    visible: "Update Request"
    timeout: 5000
- tapOn: "Update Request"

- extendedWaitUntil:
    visible: "Home"
    timeout: 10000
