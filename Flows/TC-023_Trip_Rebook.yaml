appId: com.sci.glidego_rider

name: TC-023 Trip Rebook
description: |
  Rebook a completed trip in GlideGo Rider App

properties:
  testCaseId: TC_023
  priority: Medium
  suite: Trip Request
  type: E2E
  flow: Trip Rebook
  tags: "smoke"
  owner: Hasin Daiyan
  dataSource: http://localhost:8080/WithinCity

---
# =========================================================
# Step 1: Reset app & login
# =========================================================
- launchApp:
    clearState: true

- runFlow: Login.yaml

- extendedWaitUntil:
    visible: "My Trips.*"
    timeout: 15000

# =========================================================
# Step 2: Load row data from Excel (auto-generated script)
# =========================================================
- runScript: "../Scripts/TripUpdate/TripRebook.js"

# =========================================================
# Step 3: Go to My Trips → Completed tab
# =========================================================
- extendedWaitUntil:
    visible: "My Trips.*"
    timeout: 10000
- tapOn: "My Trips"

- extendedWaitUntil:
    visible: "Completed\nTab 3 of 5"
    timeout: 10000
- tapOn: "Completed\nTab 3 of 5"

# =========================================================
# Step 4: Search for the trip
# =========================================================
- extendedWaitUntil:
    visible: "Search trip number, title"
    timeout: 10000
- tapOn: "Search trip number, title"
- eraseText
- inputText: ${output.searchText}
- tapOn: "Done"

# =========================================================
# Step 5: Open the matching trip
# =========================================================
- extendedWaitUntil:
    visible: ".*#${output.tripId}.*"
    timeout: 10000
- tapOn:
    text: ".*#${output.tripId}.*"

# =========================================================
# Step 6: Scroll to Rebook Trip and open editor
# =========================================================
- scrollUntilVisible:
    element:
      text: "Rebook Trip"
    direction: DOWN
    timeout: 15000

- extendedWaitUntil:
    visible: "Rebook Trip"
    timeout: 5000
- tapOn: "Rebook Trip"

- waitForAnimationToEnd:
    timeout: 3000

- extendedWaitUntil:
    visible: "Confirm Route"
    timeout: 10000
- tapOn: "Confirm Route"

# =========================================================
# Step 7a: Pickup Date & Time
# =========================================================
- extendedWaitUntil:
    visible: "Pickup Date & Time"
    timeout: 10000
- tapOn:
    below:
        text: "Pickup Date & Time"

- extendedWaitUntil:
    visible: ".*${output.pickupDate}.*"
    timeout: 10000
- tapOn: ".*${output.pickupDate}.*"
- tapOn: "OK"

- tapOn: "Switch to text input mode"
- doubleTapOn: "Hour"
- eraseText
- inputText: ${output.pickupHour}
- doubleTapOn: "Minute"
- eraseText
- inputText: ${output.pickupMinute}
- hideKeyboard
- tapOn: "OK"

# =========================================================
# Step 7b: Dropoff Date & Time
# =========================================================
- extendedWaitUntil:
    visible: "Dropoff Date & Time"
    timeout: 10000
- tapOn: 
    below: 
        text: "Dropoff Date & Time"

- extendedWaitUntil:
    visible: ".*${output.dropoffDate}.*"
    timeout: 10000
- tapOn: ".*${output.dropoffDate}.*"
- tapOn: "OK"

- tapOn: "Switch to text input mode"
- doubleTapOn: "Hour"
- eraseText
- inputText: ${output.dropoffHour}
- doubleTapOn: "Minute"
- eraseText
- inputText: ${output.dropoffMinute}
- hideKeyboard
- tapOn: "OK"

# =========================================================
# Step 8: Review changes
# =========================================================
- scrollUntilVisible:
    element:
      text: "Review"
    direction: DOWN
    timeout: 15000

- extendedWaitUntil:
    visible: "Review"
    timeout: 5000
- tapOn: "Review"

- scrollUntilVisible:
    element:
      text: "Pickup Date & Time:"
    direction: DOWN
    timeout: 15000

- assertVisible: "Pickup Date & Time:"
- assertVisible: "${output.pickupDateTimeReview}"

- assertVisible: "Dropoff Date & Time:"
- assertVisible: "${output.dropoffDateTimeReview}"

# =========================================================
# Step 9: Submit request and return home
# =========================================================
- scrollUntilVisible:
    element:
      text: "Submit Request"
    direction: DOWN
    timeout: 15000

- extendedWaitUntil:
    visible: "Submit Request"
    timeout: 5000
- tapOn: "Submit Request"

- extendedWaitUntil:
    visible: "Home"
    timeout: 10000


